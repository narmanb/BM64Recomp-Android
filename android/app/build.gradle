plugins { id 'com.android.application' }
def foundation = providers.gradleProperty('foundation').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'com.narmanb.bm64'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId foundation ? 'com.narmanb.bm64.foundation' : 'com.narmanb.bm64'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName foundation ? '1.0.0-android.foundation.5' : '1.0.0-android.5'
        manifestPlaceholders = [appLabel: foundation ? 'BM64 Android Foundation' : 'Bomberman 64']
        buildConfigField 'boolean', 'PLAYABLE', (!foundation).toString()
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-28',
                '-DCMAKE_BUILD_TYPE=RelWithDebInfo', "-DBM64_FOUNDATION=${foundation ? 'ON' : 'OFF'}",
                "-DBM64_FILE_TO_C=${rootProject.file('../build-host-tools/file_to_c')}"
            targets(* (foundation ? ['BM64Platform'] : ['BM64Recompiled', 'BM64Platform']))
        } }
    }
    buildFeatures { buildConfig true }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1' } }
    sourceSets.main.assets.srcDirs = ["${buildDir}/bm64-assets"]
}
tasks.register('stageBM64Assets', Sync) {
    into "${buildDir}/bm64-assets"
    into('assets') { from "${rootDir}/../assets" }
    from "${rootDir}/../recompcontrollerdb.txt"
}
tasks.named('preBuild').configure { dependsOn 'stageBM64Assets' }
